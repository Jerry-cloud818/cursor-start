<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学习计划 · Study Plan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
            display: ['"Outfit"', 'system-ui', 'sans-serif'],
          },
          colors: {
            surface: { DEFAULT: '#0f1419', card: '#161d27', elevated: '#1c2533' },
            accent: { DEFAULT: '#6366f1', soft: '#818cf8', glow: '#a5b4fc' },
          },
          boxShadow: {
            glow: '0 0 40px -10px rgba(99, 102, 241, 0.45)',
            card: '0 4px 24px -4px rgba(0, 0, 0, 0.45)',
          },
          animation: {
            'fade-in': 'fadeIn 0.35s ease-out forwards',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'scale-in': 'scaleIn 0.25s ease-out forwards',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            scaleIn: { '0%': { opacity: '0', transform: 'scale(0.96)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    [data-modal] { pointer-events: none; opacity: 0; transition: opacity 0.3s ease; }
    [data-modal].open { pointer-events: auto; opacity: 1; }
    [data-modal] .modal-panel { transform: scale(0.95) translateY(8px); opacity: 0; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; }
    [data-modal].open .modal-panel { transform: scale(1) translateY(0); opacity: 1; }
    .cal-day { transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
    .cal-day:hover:not(.empty) { transform: translateY(-1px); }
    .cal-day.selected { box-shadow: inset 0 0 0 2px rgb(99 102 241); }
    .task-row { transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease; }
    .task-row:hover { transform: translateX(4px); }
    .toast { animation: toastIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-surface text-slate-200 antialiased selection:bg-indigo-500/30 selection:text-white">
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-40 -right-40 h-96 w-96 rounded-full bg-indigo-600/20 blur-3xl"></div>
    <div class="absolute bottom-0 -left-20 h-80 w-80 rounded-full bg-violet-600/15 blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 h-64 w-64 -translate-x-1/2 -translate-y-1/2 rounded-full bg-cyan-500/5 blur-3xl"></div>
  </div>

  <header class="sticky top-0 z-40 border-b border-white/5 bg-surface/80 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
      <div class="flex items-center gap-3 animate-fade-in">
        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 shadow-glow">
          <i class="fa-solid fa-graduation-cap text-lg text-white"></i>
        </div>
        <div>
          <h1 class="font-display text-xl font-semibold tracking-tight text-white sm:text-2xl">学习计划</h1>
          <p class="text-sm text-slate-400">管理任务 · 日历视图 · 进度追踪</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2 sm:gap-3">
        <button type="button" id="btn-add-task" class="group inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white shadow-lg shadow-indigo-500/25 transition hover:bg-indigo-500 hover:shadow-indigo-500/40 active:scale-[0.98]">
          <i class="fa-solid fa-plus transition-transform group-hover:rotate-90"></i>
          添加任务
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
    <div class="grid gap-6 lg:grid-cols-12">
      <!-- Calendar -->
      <section class="lg:col-span-7 animate-slide-up" style="animation-delay: 0.05s">
        <div class="overflow-hidden rounded-2xl border border-white/5 bg-surface-card shadow-card">
          <div class="flex flex-col gap-4 border-b border-white/5 p-5 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-3">
              <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-white/5 text-indigo-400">
                <i class="fa-regular fa-calendar-days text-lg"></i>
              </span>
              <div>
                <h2 class="font-display font-semibold text-white">日历</h2>
                <p class="text-xs text-slate-500" id="cal-range-label"></p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" id="cal-prev" class="rounded-lg border border-white/10 bg-white/5 p-2 text-slate-300 transition hover:border-indigo-500/40 hover:bg-indigo-500/10 hover:text-white active:scale-95" aria-label="上月">
                <i class="fa-solid fa-chevron-left text-sm"></i>
              </button>
              <button type="button" id="cal-today" class="rounded-lg border border-white/10 px-3 py-2 text-xs font-medium text-slate-300 transition hover:border-white/20 hover:bg-white/5 hover:text-white">今天</button>
              <button type="button" id="cal-next" class="rounded-lg border border-white/10 bg-white/5 p-2 text-slate-300 transition hover:border-indigo-500/40 hover:bg-indigo-500/10 hover:text-white active:scale-95" aria-label="下月">
                <i class="fa-solid fa-chevron-right text-sm"></i>
              </button>
            </div>
          </div>
          <div class="p-4 sm:p-5">
            <div class="mb-3 grid grid-cols-7 gap-1 text-center text-[11px] font-medium uppercase tracking-wider text-slate-500 sm:text-xs">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 sm:gap-2"></div>
            <p class="mt-4 text-center text-xs text-slate-500">
              <span class="inline-flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-indigo-500"></span> 当日有计划</span>
              <span class="mx-2 text-slate-600">·</span>
              点击日期筛选右侧任务
            </p>
          </div>
        </div>
      </section>

      <!-- Task list -->
      <section class="lg:col-span-5 animate-slide-up" style="animation-delay: 0.1s">
        <div class="flex h-full min-h-[320px] flex-col overflow-hidden rounded-2xl border border-white/5 bg-surface-card shadow-card">
          <div class="flex items-center justify-between border-b border-white/5 p-5">
            <div class="flex items-center gap-3">
              <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-white/5 text-emerald-400">
                <i class="fa-solid fa-list-check"></i>
              </span>
              <div>
                <h2 class="font-display font-semibold text-white">任务</h2>
                <p class="text-xs text-slate-500" id="task-filter-hint">全部任务</p>
              </div>
            </div>
            <button type="button" id="btn-clear-filter" class="hidden text-xs text-indigo-400 transition hover:text-indigo-300">清除筛选</button>
          </div>
          <div id="task-list" class="flex-1 space-y-2 overflow-y-auto p-4 sm:p-5" style="max-height: 28rem;"></div>
          <div id="task-empty" class="hidden flex flex-1 flex-col items-center justify-center gap-3 p-8 text-center">
            <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-white/5 text-slate-600">
              <i class="fa-regular fa-clipboard text-2xl"></i>
            </div>
            <p class="text-sm text-slate-500">暂无任务，点击「添加任务」开始规划</p>
          </div>
        </div>
      </section>

      <!-- Charts -->
      <section class="lg:col-span-12 animate-slide-up" style="animation-delay: 0.15s">
        <div class="grid gap-6 md:grid-cols-2">
          <div class="rounded-2xl border border-white/5 bg-surface-card p-5 shadow-card sm:p-6">
            <div class="mb-4 flex items-center gap-3">
              <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-white/5 text-amber-400">
                <i class="fa-solid fa-chart-pie"></i>
              </span>
              <div>
                <h3 class="font-display font-semibold text-white">完成率</h3>
                <p class="text-xs text-slate-500">按分类统计已完成 / 总任务</p>
              </div>
            </div>
            <div class="relative mx-auto h-56 max-w-xs sm:h-64">
              <canvas id="chart-category"></canvas>
            </div>
          </div>
          <div class="rounded-2xl border border-white/5 bg-surface-card p-5 shadow-card sm:p-6">
            <div class="mb-4 flex items-center gap-3">
              <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-white/5 text-sky-400">
                <i class="fa-solid fa-chart-column"></i>
              </span>
              <div>
                <h3 class="font-display font-semibold text-white">本周学习时长</h3>
                <p class="text-xs text-slate-500">每日计划分钟数（含已完成）</p>
              </div>
            </div>
            <div class="relative h-56 sm:h-64">
              <canvas id="chart-weekly"></canvas>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Modal -->
  <div id="task-modal" data-modal class="fixed inset-0 z-50 flex items-end justify-center bg-black/60 p-4 backdrop-blur-sm sm:items-center">
    <div class="modal-panel w-full max-w-md rounded-2xl border border-white/10 bg-surface-elevated p-6 shadow-2xl">
      <div class="mb-6 flex items-start justify-between gap-4">
        <div>
          <h3 id="modal-title" class="font-display text-lg font-semibold text-white">添加任务</h3>
          <p class="mt-1 text-sm text-slate-400">填写学习计划详情</p>
        </div>
        <button type="button" id="modal-close" class="rounded-lg p-2 text-slate-400 transition hover:bg-white/5 hover:text-white" aria-label="关闭">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="task-form" class="space-y-4">
        <input type="hidden" id="field-id" />
        <div>
          <label for="field-title" class="mb-1.5 block text-xs font-medium text-slate-400">标题</label>
          <input id="field-title" required maxlength="120" class="w-full rounded-xl border border-white/10 bg-surface px-4 py-3 text-sm text-white placeholder-slate-600 outline-none transition focus:border-indigo-500/50 focus:ring-2 focus:ring-indigo-500/20" placeholder="例如：复习线性代数第三章" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="field-date" class="mb-1.5 block text-xs font-medium text-slate-400">日期</label>
            <input id="field-date" type="date" required class="w-full rounded-xl border border-white/10 bg-surface px-3 py-3 text-sm text-white outline-none transition focus:border-indigo-500/50 focus:ring-2 focus:ring-indigo-500/20" />
          </div>
          <div>
            <label for="field-minutes" class="mb-1.5 block text-xs font-medium text-slate-400">时长（分钟）</label>
            <input id="field-minutes" type="number" min="5" max="1440" step="5" value="45" required class="w-full rounded-xl border border-white/10 bg-surface px-3 py-3 text-sm text-white outline-none transition focus:border-indigo-500/50 focus:ring-2 focus:ring-indigo-500/20" />
          </div>
        </div>
        <div>
          <label for="field-category" class="mb-1.5 block text-xs font-medium text-slate-400">分类</label>
          <select id="field-category" class="w-full rounded-xl border border-white/10 bg-surface px-4 py-3 text-sm text-white outline-none transition focus:border-indigo-500/50 focus:ring-2 focus:ring-indigo-500/20">
            <option value="math">数学</option>
            <option value="english">英语</option>
            <option value="code">编程</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="flex items-center gap-3 rounded-xl border border-white/5 bg-white/[0.02] px-4 py-3">
          <input id="field-done" type="checkbox" class="h-4 w-4 rounded border-white/20 bg-surface text-indigo-600 focus:ring-indigo-500/40" />
          <label for="field-done" class="text-sm text-slate-300">标记为已完成</label>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" id="modal-cancel" class="flex-1 rounded-xl border border-white/10 py-3 text-sm font-medium text-slate-300 transition hover:bg-white/5">取消</button>
          <button type="submit" class="flex-1 rounded-xl bg-indigo-600 py-3 text-sm font-medium text-white shadow-lg shadow-indigo-500/20 transition hover:bg-indigo-500 active:scale-[0.98]">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-host" class="pointer-events-none fixed bottom-6 left-1/2 z-[60] flex -translate-x-1/2 flex-col gap-2 px-4"></div>

  <script>
    (function () {
      const STORAGE_KEY = 'studyPlanTasks_v1';
      const CATEGORY_META = {
        math: { label: '数学', color: '#818cf8', icon: 'fa-square-root-variable' },
        english: { label: '英语', color: '#34d399', icon: 'fa-language' },
        code: { label: '编程', color: '#38bdf8', icon: 'fa-code' },
        other: { label: '其他', color: '#fbbf24', icon: 'fa-book' },
      };

      let tasks = [];
      let viewDate = new Date();
      let selectedDateKey = null;
      let chartCategory = null;
      let chartWeekly = null;

      function uid() {
        return 't_' + Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
      }

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          tasks = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(tasks)) tasks = [];
        } catch {
          tasks = [];
        }
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function formatYMD(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      function parseYMD(s) {
        const [y, m, d] = s.split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      function toast(msg, type) {
        const host = document.getElementById('toast-host');
        const el = document.createElement('div');
        el.className =
          'toast pointer-events-auto flex items-center gap-3 rounded-xl border px-4 py-3 text-sm shadow-xl ' +
          (type === 'error'
            ? 'border-red-500/30 bg-red-950/90 text-red-100'
            : 'border-emerald-500/30 bg-emerald-950/90 text-emerald-100');
        el.innerHTML =
          '<i class="fa-solid ' +
          (type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check') +
          '"></i><span>' +
          escapeHtml(msg) +
          '</span>';
        host.appendChild(el);
        setTimeout(function () {
          el.style.opacity = '0';
          el.style.transform = 'translateY(8px)';
          el.style.transition = 'opacity 0.3s, transform 0.3s';
          setTimeout(function () {
            el.remove();
          }, 320);
        }, 2800);
      }

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function tasksOnDate(key) {
        return tasks.filter(function (t) {
          return t.date === key;
        });
      }

      function renderCalendar() {
        const y = viewDate.getFullYear();
        const m = viewDate.getMonth();
        const first = new Date(y, m, 1);
        const last = new Date(y, m + 1, 0);
        const startPad = first.getDay();
        const daysInMonth = last.getDate();
        const grid = document.getElementById('calendar-grid');
        const label = document.getElementById('cal-range-label');
        label.textContent = y + '年 ' + (m + 1) + '月';

        const todayKey = formatYMD(new Date());
        grid.innerHTML = '';

        for (let i = 0; i < startPad; i++) {
          const cell = document.createElement('div');
          cell.className = 'cal-day empty min-h-[2.5rem] rounded-lg sm:min-h-[3rem]';
          grid.appendChild(cell);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(y, m, d);
          const key = formatYMD(dateObj);
          const dayTasks = tasksOnDate(key);
          const has = dayTasks.length > 0;
          const doneAll = has && dayTasks.every(function (t) {
            return t.done;
          });
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.dataset.date = key;
          let cls =
            'cal-day relative flex min-h-[2.5rem] flex-col items-center justify-center rounded-lg border text-sm font-medium transition sm:min-h-[3rem] ';
          if (key === todayKey) cls += 'border-indigo-500/40 bg-indigo-500/10 text-white ';
          else cls += 'border-white/5 bg-white/[0.03] text-slate-300 hover:border-white/10 hover:bg-white/[0.06] ';
          if (selectedDateKey === key) cls += 'selected ';
          cell.className = cls;
          cell.setAttribute('aria-pressed', selectedDateKey === key ? 'true' : 'false');

          const num = document.createElement('span');
          num.textContent = String(d);
          cell.appendChild(num);

          if (has) {
            const dots = document.createElement('div');
            dots.className = 'mt-1 flex gap-0.5';
            const maxDots = 4;
            const slice = dayTasks.slice(0, maxDots);
            slice.forEach(function (t) {
              const dot = document.createElement('span');
              dot.className = 'h-1 w-1 rounded-full ' + (t.done ? 'bg-emerald-400' : 'bg-indigo-400');
              if (doneAll) dot.className = 'h-1 w-1 rounded-full bg-emerald-400';
              dots.appendChild(dot);
            });
            cell.appendChild(dots);
          }

          cell.addEventListener('click', function () {
            selectedDateKey = selectedDateKey === key ? null : key;
            renderCalendar();
            renderTaskList();
          });

          grid.appendChild(cell);
        }
      }

      function filteredTasks() {
        if (selectedDateKey) {
          return tasks.filter(function (t) {
            return t.date === selectedDateKey;
          });
        }
        return tasks.slice().sort(function (a, b) {
          if (a.date !== b.date) return a.date < b.date ? -1 : 1;
          return a.title.localeCompare(b.title);
        });
      }

      function renderTaskList() {
        const list = document.getElementById('task-list');
        const empty = document.getElementById('task-empty');
        const hint = document.getElementById('task-filter-hint');
        const clearBtn = document.getElementById('btn-clear-filter');
        const arr = filteredTasks();

        if (selectedDateKey) {
          hint.textContent = formatDisplayDate(selectedDateKey) + ' 的任务';
          clearBtn.classList.remove('hidden');
        } else {
          hint.textContent = '全部任务（按日期排序）';
          clearBtn.classList.add('hidden');
        }

        list.innerHTML = '';
        if (arr.length === 0) {
          list.classList.add('hidden');
          empty.classList.remove('hidden');
          return;
        }
        list.classList.remove('hidden');
        empty.classList.add('hidden');

        arr.forEach(function (t, idx) {
          const meta = CATEGORY_META[t.category] || CATEGORY_META.other;
          const row = document.createElement('div');
          row.className =
            'task-row group flex items-stretch gap-3 rounded-xl border border-white/5 bg-white/[0.02] p-3 sm:p-4 ' +
            (t.done ? 'opacity-75' : '');
          row.style.animationDelay = Math.min(idx * 0.04, 0.4) + 's';
          row.classList.add('animate-scale-in');

          const check = document.createElement('button');
          check.type = 'button';
          check.className =
            'flex w-10 shrink-0 flex-col items-center justify-center rounded-lg border transition ' +
            (t.done
              ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-400'
              : 'border-white/10 bg-white/5 text-slate-500 hover:border-indigo-500/40 hover:text-indigo-300');
          check.title = t.done ? '标记未完成' : '标记完成';
          check.innerHTML = t.done ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-regular fa-circle"></i>';
          check.addEventListener('click', function () {
            t.done = !t.done;
            save();
            renderAll();
            toast(t.done ? '已标记完成' : '已标记为未完成');
          });

          const body = document.createElement('div');
          body.className = 'min-w-0 flex-1';
          body.innerHTML =
            '<div class="flex flex-wrap items-center gap-2">' +
            '<span class="truncate font-medium text-white ' +
            (t.done ? 'line-through decoration-slate-500' : '') +
            '">' +
            escapeHtml(t.title) +
            '</span>' +
            '<span class="inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-[10px] font-medium uppercase tracking-wide text-white/90" style="background:' +
            meta.color +
            '33;color:' +
            meta.color +
            '"><i class="fa-solid ' +
            meta.icon +
            ' text-[9px]"></i> ' +
            meta.label +
            '</span></div>' +
            '<div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500">' +
            '<span><i class="fa-regular fa-calendar mr-1"></i>' +
            formatDisplayDate(t.date) +
            '</span>' +
            '<span><i class="fa-regular fa-clock mr-1"></i>' +
            t.minutes +
            ' 分钟</span></div>';

          const actions = document.createElement('div');
          actions.className = 'flex shrink-0 flex-col justify-center gap-1 opacity-100 transition sm:opacity-0 sm:group-hover:opacity-100';
          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'rounded-lg p-2 text-slate-400 transition hover:bg-indigo-500/15 hover:text-indigo-300';
          editBtn.title = '编辑';
          editBtn.innerHTML = '<i class="fa-solid fa-pen"></i>';
          editBtn.addEventListener('click', function () {
            openModal(t);
          });
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'rounded-lg p-2 text-slate-400 transition hover:bg-red-500/15 hover:text-red-400';
          delBtn.title = '删除';
          delBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
          delBtn.addEventListener('click', function () {
            if (confirm('确定删除「' + t.title + '」？')) {
              tasks = tasks.filter(function (x) {
                return x.id !== t.id;
              });
              save();
              renderAll();
              toast('任务已删除');
            }
          });
          actions.appendChild(editBtn);
          actions.appendChild(delBtn);

          row.appendChild(check);
          row.appendChild(body);
          row.appendChild(actions);
          list.appendChild(row);
        });
      }

      function formatDisplayDate(ymd) {
        const d = parseYMD(ymd);
        return d.getMonth() + 1 + '月' + d.getDate() + '日';
      }

      function chartTextColor() {
        return '#94a3b8';
      }

      function chartGridColor() {
        return 'rgba(148, 163, 184, 0.12)';
      }

      function updateCharts() {
        const labels = [];
        const doneData = [];
        const totalData = [];
        const colors = [];
        Object.keys(CATEGORY_META).forEach(function (k) {
          const meta = CATEGORY_META[k];
          labels.push(meta.label);
          const subset = tasks.filter(function (t) {
            return t.category === k;
          });
          const done = subset.filter(function (t) {
            return t.done;
          }).length;
          const total = subset.length;
          doneData.push(done);
          totalData.push(Math.max(total, 0.0001));
          colors.push(meta.color);
        });

        const completionRates = labels.map(function (_, i) {
          return totalData[i] ? Math.round((doneData[i] / totalData[i]) * 100) : 0;
        });

        const catCtx = document.getElementById('chart-category').getContext('2d');
        if (chartCategory) chartCategory.destroy();
        chartCategory = new Chart(catCtx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [
              {
                label: '完成率 %',
                data: completionRates,
                backgroundColor: colors.map(function (c) {
                  return c + 'cc';
                }),
                borderColor: '#161d27',
                borderWidth: 2,
                hoverOffset: 8,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '62%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: chartTextColor(), padding: 14, usePointStyle: true, pointStyle: 'circle' },
              },
              tooltip: {
                callbacks: {
                  label: function (ctx) {
                    const i = ctx.dataIndex;
                    return ' 已完成 ' + doneData[i] + ' / ' + Math.round(totalData[i]) + ' · ' + ctx.parsed + '%';
                  },
                },
              },
            },
          },
        });

        const now = new Date();
        const weekStart = new Date(now);
        weekStart.setDate(now.getDate() - now.getDay());
        const weekLabels = [];
        const weekMinutes = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(weekStart);
          d.setDate(weekStart.getDate() + i);
          const key = formatYMD(d);
          weekLabels.push(['日', '一', '二', '三', '四', '五', '六'][i]);
          const mins = tasks
            .filter(function (t) {
              return t.date === key;
            })
            .reduce(function (s, t) {
              return s + (t.minutes || 0);
            }, 0);
          weekMinutes.push(mins);
        }

        const weekCtx = document.getElementById('chart-weekly').getContext('2d');
        if (chartWeekly) chartWeekly.destroy();
        const grad = weekCtx.createLinearGradient(0, 0, 0, 200);
        grad.addColorStop(0, 'rgba(99, 102, 241, 0.65)');
        grad.addColorStop(1, 'rgba(139, 92, 246, 0.15)');

        chartWeekly = new Chart(weekCtx, {
          type: 'bar',
          data: {
            labels: weekLabels,
            datasets: [
              {
                label: '分钟',
                data: weekMinutes,
                backgroundColor: grad,
                borderRadius: 8,
                borderSkipped: false,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                grid: { color: chartGridColor() },
                ticks: { color: chartTextColor() },
              },
              y: {
                beginAtZero: true,
                grid: { color: chartGridColor() },
                ticks: { color: chartTextColor() },
              },
            },
            plugins: {
              legend: { display: false },
            },
          },
        });
      }

      function renderAll() {
        renderCalendar();
        renderTaskList();
        updateCharts();
      }

      function openModal(task) {
        const modal = document.getElementById('task-modal');
        const title = document.getElementById('modal-title');
        document.getElementById('field-id').value = task ? task.id : '';
        document.getElementById('field-title').value = task ? task.title : '';
        document.getElementById('field-date').value = task ? task.date : selectedDateKey || formatYMD(new Date());
        document.getElementById('field-minutes').value = task ? task.minutes : 45;
        document.getElementById('field-category').value = task ? task.category : 'math';
        document.getElementById('field-done').checked = task ? !!task.done : false;
        title.textContent = task ? '编辑任务' : '添加任务';
        modal.classList.add('open');
        document.getElementById('field-title').focus();
      }

      function closeModal() {
        document.getElementById('task-modal').classList.remove('open');
      }

      document.getElementById('btn-add-task').addEventListener('click', function () {
        openModal(null);
      });
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('task-modal').addEventListener('click', function (e) {
        if (e.target.id === 'task-modal') closeModal();
      });

      document.getElementById('cal-prev').addEventListener('click', function () {
        viewDate.setMonth(viewDate.getMonth() - 1);
        renderAll();
      });
      document.getElementById('cal-next').addEventListener('click', function () {
        viewDate.setMonth(viewDate.getMonth() + 1);
        renderAll();
      });
      document.getElementById('cal-today').addEventListener('click', function () {
        viewDate = new Date();
        selectedDateKey = formatYMD(new Date());
        renderAll();
      });

      document.getElementById('btn-clear-filter').addEventListener('click', function () {
        selectedDateKey = null;
        renderAll();
      });

      document.getElementById('task-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const idField = document.getElementById('field-id').value;
        const title = document.getElementById('field-title').value.trim();
        const date = document.getElementById('field-date').value;
        const minutes = parseInt(document.getElementById('field-minutes').value, 10) || 0;
        const category = document.getElementById('field-category').value;
        const done = document.getElementById('field-done').checked;
        if (!title) {
          toast('请填写标题', 'error');
          return;
        }
        if (idField) {
          const t = tasks.find(function (x) {
            return x.id === idField;
          });
          if (t) {
            t.title = title;
            t.date = date;
            t.minutes = minutes;
            t.category = category;
            t.done = done;
          }
          toast('任务已更新');
        } else {
          tasks.push({ id: uid(), title: title, date: date, minutes: minutes, category: category, done: done });
          toast('任务已添加');
        }
        save();
        closeModal();
        renderAll();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
      });

      load();
      if (!localStorage.getItem(STORAGE_KEY)) {
        const demo = new Date();
        tasks = [
          { id: uid(), title: '微积分习题集 P.42–48', date: formatYMD(demo), minutes: 60, category: 'math', done: false },
          { id: uid(), title: '英语听力精听 30 分钟', date: formatYMD(demo), minutes: 30, category: 'english', done: true },
          { id: uid(), title: 'TypeScript 泛型笔记整理', date: formatYMD(new Date(demo.getTime() + 86400000)), minutes: 45, category: 'code', done: false },
        ];
        save();
      }
      renderAll();
    })();
  </script>
</body>
</html>
